name: WebForge Deploy

on:
  push:
    branches: [main, arena/01a07223-webforge-ai]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: List forged sites
        run: ls -la sites/ || echo "No sites yet"
